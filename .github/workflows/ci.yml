name: Java CI with Maven

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main"]

jobs:

  checkstyle:

    name: Checkstyle
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-and-test:

    name: Build and Test
    runs-on: ubuntu-latest

    needs: checkstyle

    strategy:
      matrix:
        java-version: ['21', '22', '23']

    steps:

      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn -B test --no-transfer-progress

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk-${{ matrix.java-version }}
          path: target/surefire-reports/

  package:

    name: Package JAR
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.ref == 'refs/heads/main'

    steps:

      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Run JAR
        run: java -jar target/my-app-1.0-SNAPSHOT.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: target/*.jar

  notify:

    name: Notify
    runs-on: ubuntu-latest

    needs: [checkstyle, build-and-test, package]

    if: always() && github.ref == 'refs/heads/main'

    steps:

      - name: Summary
        run: |
          echo "CI/CD pipeline completed"
